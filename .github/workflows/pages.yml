name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --workspace=apps/web

      - name: Copy static asset directories to dist
        run: |
          cd apps/web
          # Vite의 publicDir(public/)에 포함되지 않는 정적 에셋을 dist/로 복사
          for dir in WorldMap images Hitbox bgm Skillicon charactericon icon; do
            if [ -d "$dir" ]; then
              echo "📁 복사 중: $dir"
              cp -r "$dir" dist/
            fi
          done
          # 단일 파일
          [ -f favicon.png ] && cp favicon.png dist/
          echo "✅ 에셋 복사 완료"
          ls dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
