<!-- sensor-panel: map-viewport 내부 또는 시뮬레이터 영역에 include하여 사용 -->
<div id="sensor-panel" style="
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  background: #202632;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 14px 16px;
  gap: 10px;
  flex-direction: column;
  min-width: 200px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
">
  <!-- 상태 표시 -->
  <div style="display:flex; align-items:center; gap:8px;">
    <span id="sensor-status-dot" style="
      width:10px; height:10px; border-radius:50%;
      background:#6b7280; flex-shrink:0;
    "></span>
    <span id="sensor-status-text" style="font-size:13px; color:#b0b8c1; font-weight:600;">센서 대기 중</span>
  </div>

  <!-- Mock / WS 모드 전환 -->
  <div style="display:flex; gap:6px;">
    <button id="sensor-mock-btn"
      onclick="window._mp1SetSensorMode('mock')"
      class="active"
      style="
        flex:1; padding:6px 0; font-size:12px; font-weight:600;
        border:none; border-radius:8px; cursor:pointer;
        background:#2b323e; color:#b0b8c1; transition:0.2s;
      "
    >Mock</button>
    <button id="sensor-ws-btn"
      onclick="window._mp1SetSensorMode('ws')"
      style="
        flex:1; padding:6px 0; font-size:12px; font-weight:600;
        border:none; border-radius:8px; cursor:pointer;
        background:#2b323e; color:#b0b8c1; transition:0.2s;
      "
    >WS</button>
  </div>

  <!-- 연결 토글 -->
  <button id="sensor-toggle-btn"
    onclick="window._mp1SensorToggle()"
    style="
      width:100%; padding:8px 0; font-size:13px; font-weight:700;
      border:none; border-radius:10px; cursor:pointer;
      background:#3182f6; color:#fff; transition:0.2s;
    "
  >Mock 센서 켜기</button>

  <!-- 궤적 표시 토글 -->
  <button id="trail-toggle-btn"
    onclick="window._mp1TrailToggle()"
    style="
      width:100%; padding:6px 0; font-size:12px; font-weight:600;
      border:none; border-radius:8px; cursor:pointer;
      background:#2b323e; color:#b0b8c1; transition:0.2s;
    "
  >궤적 숨기기</button>
</div>

<style>
  #sensor-mock-btn.active,
  #sensor-ws-btn.active {
    background: #3182f6 !important;
    color: #fff !important;
  }
</style>
